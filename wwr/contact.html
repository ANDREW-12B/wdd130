<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nile Rapids Rafting | Contact Us</title>

    <meta name="description"
      content="Contact Nile Rapids Rafting for questions, reservations, and information about our whitewater rafting adventures.">

    <meta name="author" content="Bwoye Andrew Nampogo">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.jpg" alt="Nile Rapids Rafting logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="contact-header">
            <h1>Contact Us</h1>

            <div class="company-info">
                <h2>Nile Rapids Rafting</h2>

                <address>
                    123 Main River Street<br>
                    Jinja, Uganda<br>
                    <a href="tel:+256700000000">+256 700 000 000</a><br>
                    <a href="tel:+256780000000">+256 780 000 000</a><br>
                    <a href="mailto:info@nilerapidsrafting.com">info@nilerapidsrafting.com</a>
                </address>
            </div>
        </section>

        <section class="contact-content">

            <div class="contact-map">
                <h2>Find Us</h2>

                <iframe src="https://www.google.com/maps?q=Jinja%2C%20Uganda&output=embed"
                  title="Map showing the location of Jinja, Uganda" loading="lazy">
                </iframe>
            </div>

            <form class="contact-form">

                <h2>Send Us a Message</h2>

                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Message Purpose</legend>

                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <label for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send My Message</button>

            </form>

        </section>

        <section class="employees">

            <h2>Meet Our Team</h2>

            <div class="employee-grid">

                <figure>
                    <img src="images/rafting16_1024.jpg" alt="Rafting team on the river">
                    <figcaption>Lead Rafting Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/rafting27_1024.jpg" alt="Rafting team enjoying the river">
                    <figcaption>Safety Coordinator</figcaption>
                </figure>

                <figure>
                    <img src="images/rafting41_1024.jpg" alt="Rafting team navigating rapids">
                    <figcaption>Reservations Manager</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>© 2026 Nile Rapids Rafting | Bwoye Andrew Nampogo</p>

        <nav class="socialmedia">

            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="https://instagram.com" target="_blank" rel="noopener">
                <img src="images/instagram.svg" alt="Instagram">
            </a>

            <a href="https://linkedin.com" target="_blank" rel="noopener">
                <img src="images/linkedin.svg" alt="LinkedIn">
            </a>

        </nav>

    </footer>

</body>

</html>
